<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ethik Klasse 7 – Materialien</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--kraft:#b98d5e;--paper:#fbf3e3;--paper2:#f3e4c8;--ink:#3a2615;--ink2:#6b4a2e;--red:#b44a2a;--gold:#d9a23a;--green:#4f7a36}
*{box-sizing:border-box}
body{margin:0;font-family:'Comic Neue','Comic Sans MS',cursive;color:var(--ink);font-size:18px;line-height:1.45;
  background:var(--kraft);
  background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px),radial-gradient(rgba(0,0,0,.06) 1px,transparent 1px);
  background-size:14px 14px,22px 22px;background-position:0 0,7px 11px;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 40px}
h1,h2,.bang{font-family:'Bangers',cursive;letter-spacing:1px;font-weight:400}
header{text-align:center;color:var(--paper);text-shadow:3px 3px 0 var(--ink)}
header h1{font-size:52px;margin:0}
header p{margin:4px 0 22px;font-weight:700;color:#fff4dc;text-shadow:1px 1px 0 var(--ink)}
.bubble{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:14px 18px;position:relative;margin:0 0 30px;box-shadow:5px 5px 0 var(--ink)}
.bubble:after{content:"";position:absolute;left:40px;bottom:-18px;border:9px solid transparent;border-top:14px solid var(--ink)}
.bubble:before{content:"";position:absolute;left:43px;bottom:-10px;border:6px solid transparent;border-top:10px solid #fff;z-index:2}
.unit{margin-bottom:26px}
.unit h2{color:var(--paper);text-shadow:2px 2px 0 var(--ink);font-size:32px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
a.card,.card{display:block;text-decoration:none;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:14px;
  box-shadow:6px 6px 0 var(--ink);padding:16px 18px;transition:transform .12s}
a.card:hover,a.card:active{transform:translate(-2px,-2px) rotate(-.6deg);box-shadow:8px 8px 0 var(--ink)}
.card .ico{font-size:40px;line-height:1}
.card h3{font-family:'Bangers';font-weight:400;letter-spacing:1px;font-size:26px;margin:6px 0 2px;color:var(--red)}
.card p{margin:0 0 12px;font-size:16px}
.go{display:inline-block;font-family:'Bangers';letter-spacing:1px;font-size:20px;background:var(--gold);border:3px solid var(--ink);border-radius:10px;padding:4px 14px;box-shadow:3px 3px 0 var(--ink)}
.card.soon{background:var(--paper2);border-style:dashed;box-shadow:none;opacity:.85}
.card.soon .go{background:#e8dcc4;box-shadow:none}
.tag{display:inline-block;background:var(--ink);color:var(--paper);border-radius:8px;padding:1px 9px;font-size:13px;font-weight:700;margin-bottom:8px}
footer{text-align:center;color:#fff4dc;font-weight:700;text-shadow:1px 1px 0 var(--ink);margin-top:20px;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🤔 Ethik Klasse 7 💬</h1>
    <p>Materialien für den Unterricht</p>
  </header>

  <div class="bubble">Hallo! Hier findet ihr alle interaktiven Aufgaben für unseren Ethikunterricht. Tippt auf eine Karte, um loszulegen.</div>

  <div id="units"></div>

  <footer>Horlacher Ethik Kl. 7 SJ 2026_27</footer>
</div>

<script>
/* =====================================================================
   NEUE INHALTE HINZUFÜGEN – nur hier etwas ändern!
   ---------------------------------------------------------------------
   Jede Karte ist eine Zeile in geschweiften Klammern { ... }.
   - thema: kleines Etikett oben auf der Karte (z. B. Lernbereich) – darf leer sein
   - icon:  ein Emoji
   - title: Name der Karte
   - text:  kurze Beschreibung
   - link:  Dateiname der HTML-Seite (muss im selben GitHub-Ordner liegen)
            Leer lassen ("") = Karte erscheint als "Bald verfügbar".
   Neue Karte: eine Zeile kopieren, Komma dahinter nicht vergessen.
   Die Karten erscheinen in der Reihenfolge, in der sie hier stehen.
   ===================================================================== */
const CARDS = [
  { thema: "Verstehen und Verständigung", icon: "💥", title: "Konflikte lösen", text: "Gruppen-Expedition in 8 Stationen: Vier Wege aus dem Konflikt, Konfliktlösungsmodelle und der Vier-Fragen-Test.", link: "konflikte-loesen.html" },
  { thema: "", icon: "✨", title: "Demnächst", text: "Hier kommen bald neue Inhalte.", link: "" }
];

/* --- ab hier nichts ändern --- */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tag = c => c.thema ? `<span class="tag">${esc(c.thema)}</span>` : "";
document.getElementById("units").innerHTML = `<div class="grid">${CARDS.map(c => c.link
  ? `<a class="card" href="${esc(c.link)}">${tag(c)}<div class="ico">${c.icon}</div><h3>${esc(c.title)}</h3><p>${esc(c.text)}</p><span class="go">Los geht's ➜</span></a>`
  : `<div class="card soon">${tag(c)}<div class="ico">${c.icon}</div><h3>${esc(c.title)}</h3><p>${esc(c.text)}</p><span class="go">Bald verfügbar</span></div>`
).join("")}</div>`;
</script>
</body>
</html>
